edition: "community"
image:
  repository: sonarqube
  tag: 8.9-{{ .Values.edition }}
  pullPolicy: IfNotPresent
service:
  type: NodePort
  externalPort: 9000
  internalPort: 9000
  #nodePort: 
ingress:
  enabled: true
  hosts:
    - name: sonarqube.talentedge.dev
  annotations:
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS":443}]'
    alb.ingress.kubernetes.io/actions.ssl-redirect: '{"Type": "redirect", "RedirectConfig": { "Protocol": "HTTPS", "Port": "443", "StatusCode": "HTTP_301"}}'
    alb.ingress.kubernetes.io/group.order: "200"
    alb.ingress.kubernetes.io/group.name: ingress-alb-prod-public
  # ingressClassName: nginx
postgresql:
  # Enable to deploy the bitnami PostgreSQL chart
  enabled: true
  ## bitnami/postgres image tag
  # image:
  #   tag: 11.7.0-debian-10-r9
  postgresqlUsername: "sonarUser"
  postgresqlPassword: "sonarPass"
  postgresqlDatabase: "sonarDB"
  # Specify the TCP port that PostgreSQL should use
  service:
    port: 5432
  persistence:
    enabled: true
    accessMode: ReadWriteOnce
    size: 20Gi
    storageClass:
extraConfig:
  secrets: []
  configmaps: []