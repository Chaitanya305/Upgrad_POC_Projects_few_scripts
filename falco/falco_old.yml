image:
  pullPolicy: IfNotPresent
  registry: docker.io
  repository: falcosecurity/falco
  tag: ""

tty: true

controller:
  # Available options: deployment, daemonset.
  kind: daemonset
  daemonset:
    updateStrategy:
      type: RollingUpdate

metrics:
  enabled: false

customRules:
  {}

falcosidekick:
  # -- Enable falcosidekick deployment.
  enabled: true
  replicaCount: 2
  image:
  registry: docker.io
  repository: falcosecurity/falcosidekick
  tag: 2.30.0
  pullPolicy: IfNotPresent
  config:
    extraEnv:
      - name: SMTP_USER
        valueFrom:
          secretKeyRef:
            name: smtp-secret
            key: smtp-user
      - name: SMTP_PASSWORD
        valueFrom:
          secretKeyRef:
            name: smtp-secret
            key: smtp-password
    debug: true
    smtp:
      hostport: "email-smtp.ap-south-1.amazonaws.com:587"
      # -- use TLS connection (true/false)
      tls: true
      # -- SASL Mechanisms : plain, oauthbearer, external, anonymous or "" (disable SASL)
      authmechanism: "plain"
      user: "${SMTP_USER}"
      password: "${SMTP_PASSWORD}"
      token: ""
      identity: ""
      trace: ""
      # -- Sender address (mandatory if SMTP output is *enabled*)
      from: "chaitanyagolhar35@gmail.com"
      to: "chaitanyagolhar0305@gmail.com"
      outputformat: "html"
      minimumpriority: "error"