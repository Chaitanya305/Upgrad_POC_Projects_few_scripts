replicaCount: 2
image:
  registry: docker.io
  repository: falcosecurity/falcosidekick
  tag: 2.31.1
  pullPolicy: IfNotPresent
webui:
  # -- enable Falcosidekick-UI
  enabled: true
  replicaCount: 1
  # -- User in format <login>:<password>
  user: "admin:admin"
  image:
    registry: docker.io
    repository: falcosecurity/falcosidekick-ui
    tag: "2.2.0"
    pullPolicy: IfNotPresent
  service:
    type: NodePort
    port: 2802
    nodePort: 30282
    targetPort: 2802
    annotations: {}
  ingress:
    enabled: false
    ingressClassName: alb
    annotations:
      alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS":443}]'
      alb.ingress.kubernetes.io/actions.ssl-redirect: '{"Type": "redirect", "RedirectConfig": { "Protocol": "HTTPS", "Port": "443", "StatusCode": "HTTP_301"}}'
      alb.ingress.kubernetes.io/group.order: "200"
      alb.ingress.kubernetes.io/group.name: ingress-alb-prod-management
    hosts:
      - host: falcosidekick-ui.talentedge.dev
        paths:
        - path: /*
    #tls: []
  externalRedis:
    # -- Enable or disable the usage of an external Redis. Is mutually exclusive with webui.redis.enabled.
    enabled: false
    # -- The URL of the external Redis database with RediSearch > v2
    url: ""
    # -- Set the password of the external Redis
    password: ""
    # --  The port of the external Redis database with RediSearch > v2
    port: 6379
  redis:
    enabled: true
    image:
      registry: docker.io
      repository: redis/redis-stack
      tag: "7.2.0-v11"
      pullPolicy: IfNotPresent
    customConfig: {}
    # - maxmemory-policy allkeys-lfu
    # - maxmemory 4096mb
    # -- Set a password for Redis
    password: ""
    # -- Enable the PVC for the redis pod
    storageEnabled: true
    # -- Size of the PVC for the redis pod
    storageSize: "3Gi"
    # -- Storage class of the PVC for the redis pod
    storageClass: "local-path"
    service:
      type: ClusterIP
      port: 6379
      targetPort: 6379
      # -- The web UI Redis service annotations (use this to set a internal LB, for example.)
      annotations: {}

config:
  extraEnv:
    - name: SMTP_USER
      valueFrom:
        secretKeyRef:
          name: smtp-secret
          key: smtp-user
    - name: SMTP_PASSWORD
      valueFrom:
        secretKeyRef:
          name: smtp-secret
          key: smtp-password
  debug: true
  smtp:
    hostport: "email-smtp.ap-south-1.amazonaws.com:587"
    # -- use TLS connection (true/false)
    tls: true
    # -- SASL Mechanisms : plain, oauthbearer, external, anonymous or "" (disable SASL)
    authmechanism: "plain"
    user: "${SMTP_USER}"
    password: "${SMTP_PASSWORD}"
    token: ""
    identity: ""
    trace: ""
    # -- Sender address (mandatory if SMTP output is *enabled*)
    from: "devops@upgrad.com"
    to: "chaitanya.golhar@upgrad.com"
    outputformat: "html"
    minimumpriority: "error"