image:
  pullPolicy: IfNotPresent
  registry: docker.io
  repository: falcosecurity/falco
  tag: ""

tty: true

driver:
  # -- Set it to false if you want to deploy Falco without the drivers.
  # Always set it to false when using Falco with plugins.
  enabled: true

controller:
  # Available options: deployment, daemonset
  kind: daemonset
  daemonset:
    updateStrategy:
      type: RollingUpdate

metrics:
  enabled: false

falcoctl:
  config:
    artifact:
      install:
        refs: [falco-rules:3,falco-incubating-rules:4,falco-sandbox-rules:4]
      follow:
        refs: [falco-rules:3,falco-incubating-rules:4,falco-sandbox-rules:4]

customRules:
  rules-traefik.yaml: |-

     - rule: Polkit Local Privilege Escalation Vulnerability (CVE-2021-4034)
       enabled: true
       override:
        enabled: replace 
     - rule: Java Process Class File Download
       enabled: true
       override:
        enabled: replace 
     - rule: Schedule Cron Jobs
       enabled: true
       override:
        enabled: replace 
     - rule: Read sensitive file trusted after startup
       enabled: true
       override:
         enabled: replace
     - rule: Modify binary dirs
       enabled: true
       override:
         enabled: replace
     - rule: Terminal shell in container
       enabled: true
       override:
         enabled: replace
     - rule: Contact EC2 Instance Metadata Service From Container
       enabled: true
       override:
         enabled: replace
     - rule: Netcat Remote Code Execution in Container
       enabled: true
       override:
         enabled: replace
     - rule: Launch Suspicious Network Tool in Container
       enabled: true
       override:
         enabled: replace
     - rule: Launch Suspicious Network Tool on Host
