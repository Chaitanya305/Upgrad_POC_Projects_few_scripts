service:
  enabled: true
  type: ClusterIP

resources:
  requests:
    cpu: "500m"
    memory: "1Gi"
  limits:
    cpu: "500m"
    memory: "1Gi"

ingress:
  enabled: false
  
volumeClaimTemplate:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path 
  resources:
    requests:
      storage: 1Gi